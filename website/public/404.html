<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Serhii Voznyi</title>
    <script>
      // Static hosts (GitHub Pages) serve this file for deep links such as /blog/some-post.
      // Remember the requested path and hand it to the SPA, which restores it in index.html.
      sessionStorage.setItem(
        'sv:redirect',
        location.pathname + location.search + location.hash,
      )
      location.replace('/')
    </script>
  </head>
  <body></body>
</html>
